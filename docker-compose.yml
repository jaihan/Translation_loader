services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wyzauto
      POSTGRES_PASSWORD: wyzauto
      POSTGRES_DB: wyzauto
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wyzauto -d wyzauto"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5040:80"
    depends_on:
      postgres:
        condition: service_healthy