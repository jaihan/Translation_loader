services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wyzauto
      POSTGRES_PASSWORD: wyzauto
      POSTGRES_DB: wyzauto
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wyzauto -d wyzauto"]
      interval: 5s
      timeout: 5s
      retries: 10
